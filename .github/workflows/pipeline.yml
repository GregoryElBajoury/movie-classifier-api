name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Run Quality Gate & Tests
        run: |
          echo "=== Lancement de la barrière qualité ==="
          python check_quality.py
          echo "=== Barrière qualité validée avec succès ==="

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t movie-api .

      - name: Test container startup
        run: |
          # Lancement du conteneur en arrière-plan
          docker run -d -p 8000:8000 --name movie-container movie-api
          
          # Attente active que l'API réponde (maximum 15 secondes)
          echo "Attente du démarrage de l'API..."
          for i in {1..15}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "L'API est prête !"
              exit 0
            fi
            sleep 1
          done
          
          echo "Erreur : L'API n'a pas démarré à temps. Affichage des logs du conteneur :"
          docker logs movie-container
          exit 1

  publier:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Info
        run: |
          echo "=== DEBUG INFO ==="
          echo "GitHub SHA : ${{ github.sha }}"
          echo "Registry Server : ${{ secrets.AZURE_REGISTRY_SERVER }}"
          echo "Current directory contents:"
          ls -la

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image to Azure
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_SERVER }}/movie-classifier-api:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_SERVER }}/movie-classifier-api:latest