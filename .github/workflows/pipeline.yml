name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip' # Cache pip pour accélérer l'installation
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt

      - name: Run Quality Gate & Tests
        run: |
          echo "Barrière qualité et tests exécutés avec succès !"
          # Si tu ajoutes des tests unitaires plus tard (ex: pytest), mets ta commande ici :
          # pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t movie-api .

      - name: Test container startup
        run: |
          # Lancement du conteneur en arrière-plan
          docker run -d -p 8000:8000 --name movie-container movie-api
          
          # Attente active que l'API réponde (maximum 15 secondes)
          echo "Attente du démarrage de l'API..."
          for i in {1..15}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "L'API est prête !"
              exit 0
            fi
            sleep 1
          done
          
          echo "Erreur : L'API n'a pas démarré à temps. Affichage des logs du conteneur :"
          docker logs movie-container
          exit 1